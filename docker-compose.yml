version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplesshop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: peoplesshop
      POSTGRES_USER: peoplesshop
      POSTGRES_PASSWORD: PeoplesShop@2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplesshop -d peoplesshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to use pgAdmin for DB inspection
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: peoplesshop_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@peoplesshop.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
    driver: local
